name: dbt CI

# Trigger: runs automatically on every Pull Request targeting main
# This gate prevents broken code from reaching production
on:
  pull_request:
    branches: [main]

jobs:
  dbt-ci:
    # Use GitHub's hosted Ubuntu runner — fresh VM spun up for each run
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the PR branch code onto the GitHub VM
      # fetch-depth: 0 ensures full git history is available (needed for state comparison)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Install Python 3.11 on the GitHub VM
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install dbt with BigQuery adapter
      # Pinned to exact version to ensure reproducible CI runs
      - name: Install dbt
        run: pip install dbt-bigquery==1.11.1

      # Step 4: Write the BigQuery service account JSON to a temp file
      # The actual credentials are stored as a GitHub Secret — never in the repo
      # /tmp/keyfile.json is referenced by profiles_ci.yml
      - name: Write BigQuery credentials
        run: echo '${{ secrets.BIGQUERY_SERVICE_ACCOUNT }}' > /tmp/keyfile.json

      # Step 5: Copy the committed CI profiles file to profiles.yml
      # profiles.yml is gitignored (contains secrets), profiles_ci.yml is safe to commit
      # It points to dbt_ci_* datasets in BigQuery for isolated CI runs
      - name: Copy CI profiles
        run: cp profiles_ci.yml profiles.yml

      # Step 6: Install dbt packages defined in packages.yml
      # e.g. dbt_utils, dbt_expectations, codegen
      - name: Install dbt packages
        run: dbt deps

      # Step 7: Try to restore the cached prod manifest from the previous CI run
      # The manifest.json is used for state comparison (state:modified+)
      # If no cache exists (first ever run), the cache step is skipped gracefully
      - name: Download previous manifest
        uses: actions/cache@v4
        id: cache-manifest
        with:
          path: ./previous-state
          key: dbt-manifest-${{ github.base_ref }}

      # Step 8: Zero-copy clone strategy (runs only if manifest cache exists)
      # dbt clone creates instant BigQuery table clones of unchanged prod models into CI dataset
      # This is zero-storage (clones share storage with prod) and runs in seconds
      # Unchanged models don't need to be rebuilt — they are cloned from prod instantly
      - name: Clone prod tables into CI dataset
        run: |
          if [ -d "./previous-state" ] && [ -f "./previous-state/manifest.json" ]; then
            echo "Cloning unchanged prod tables into CI dataset (zero-copy clone)"
            dbt clone --target ci --state ./previous-state
          else
            echo "No previous manifest — skipping clone step"
          fi
        env:
          DBT_PROFILES_DIR: .

      # Step 9: Slim CI build — only builds and tests what changed in this PR
      # state:modified+ selects changed models and all their downstream dependencies
      # --defer resolves unchanged upstream refs against prod instead of rebuilding them
      # --state points to the cached prod manifest for comparison
      # Falls back to full build on first run (no manifest cache available yet)
      - name: Run slim dbt build
        run: |
          if [ -d "./previous-state" ] && [ -f "./previous-state/manifest.json" ]; then
            echo "Previous manifest found — running slim CI (state:modified+) with --defer"
            dbt build --target ci --select state:modified+ --defer --state ./previous-state
          else
            echo "No previous manifest — running full build"
            dbt build --target ci
          fi
        env:
          DBT_PROFILES_DIR: .

      # Step 10: Save the manifest generated by this run for the next PR's state comparison
      # This manifest becomes the reference point for the next CI run
      - name: Save manifest for next run
        run: |
          mkdir -p ./previous-state
          cp target/manifest.json ./previous-state/manifest.json

      # Step 11: Cache the manifest so it's available for the next PR
      # Keyed by base branch (main) so all PRs targeting main share the same cache
      - name: Cache manifest
        uses: actions/cache/save@v4
        with:
          path: ./previous-state
          key: dbt-manifest-${{ github.base_ref }}

      # Step 12: Upload dbt artifacts (test results, manifest, run_results)
      # Always runs even if tests fail — useful for debugging failed CI runs
      # Artifacts are downloadable from the GitHub Actions run page
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-test-results
          path: target/