version: 2

models:
  - name: fact_events
    description: "Fact table containing one row per GA4 event with foreign keys to all dimensions. Central table of the star schema covering all user interactions on the Google Merchandise Store."
    columns:
      - name: event_key
        description: "Surrogate primary key generated from user_pseudo_id, event_name and event_timestamp"
        tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: user_key
        description: "Foreign key to dim_user"
        tests:
          - not_null:
              config:
                severity: error
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_key
              config:
                severity: error
      - name: device_key
        description: "Foreign key to dim_device"
        tests:
          - not_null:
              config:
                severity: error
          - relationships:
              arguments:
                to: ref('dim_device')
                field: device_key
              config:
                severity: error
      - name: geo_key
        description: "Foreign key to dim_geo"
        tests:
          - not_null:
              config:
                severity: error
          - relationships:
              arguments:
                to: ref('dim_geo')
                field: geo_key
              config:
                severity: error
      - name: traffic_key
        description: "Foreign key to dim_traffic_source"
        tests:
          - not_null:
              config:
                severity: error
          - relationships:
              arguments:
                to: ref('dim_traffic_source')
                field: traffic_key
              config:
                severity: error
      - name: event_date
        description: "Date of the event"
        tests:
          - not_null:
              config:
                severity: error
      - name: event_name
        description: "Name of the GA4 event (e.g. page_view, purchase, session_start)"
        tests:
          - not_null:
              config:
                severity: error
          - dbt_expectations.expect_column_value_lengths_to_be_between:
              arguments:
                min_value: 1
                max_value: 100
              config:
                severity: warn
      - name: event_timestamp
        description: "Exact timestamp of the event"
        tests:
          - not_null:
              config:
                severity: error
      - name: event_value_in_usd
        description: "Monetary value of the event in USD if applicable"
      - name: platform
        description: "Platform of the event (WEB, IOS, ANDROID)"
        tests:
          - accepted_values:
              arguments:
                values: ['WEB', 'IOS', 'ANDROID']
              config:
                severity: warn
      - name: stream_id
        description: "GA4 data stream identifier"

  - name: fact_purchases
    description: "Fact table containing one row per purchase transaction. Filtered subset of fact_events where event_name = purchase with revenue metrics."
    config:
      contract:
        enforced: true
    columns:
      - name: purchase_key
        description: "Surrogate primary key generated from user_pseudo_id and event_timestamp"
        data_type: string
        tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
      - name: user_key
        description: "Foreign key to dim_user"
        data_type: string
        tests:
          - not_null:
              config:
                severity: error
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_key
              config:
                severity: error
      - name: geo_key
        description: "Foreign key to dim_geo"
        data_type: string
        tests:
          - not_null:
              config:
                severity: error
          - relationships:
              arguments:
                to: ref('dim_geo')
                field: geo_key
              config:
                severity: error
      - name: traffic_key
        description: "Foreign key to dim_traffic_source"
        data_type: string
        tests:
          - not_null:
              config:
                severity: error
          - relationships:
              arguments:
                to: ref('dim_traffic_source')
                field: traffic_key
              config:
                severity: error
      - name: device_key
        description: "Foreign key to dim_device"
        data_type: string
        tests:
          - not_null:
              config:
                severity: error
          - relationships:
              arguments:
                to: ref('dim_device')
                field: device_key
              config:
                severity: error
      - name: event_date
        description: "Date of the purchase"
        data_type: date
        tests:
          - not_null:
              config:
                severity: error
      - name: revenue_usd
        description: "Purchase revenue in USD"
        data_type: float64
        tests:
          - not_null:
              config:
                severity: error
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 10000
              config:
                severity: warn
          - assert_column_is_positive:
              config:
                severity: error
      - name: event_timestamp
        description: "Exact timestamp of the purchase"
        data_type: timestamp
        tests:
          - not_null:
              config:
                severity: error